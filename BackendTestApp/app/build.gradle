plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orz.picootbackendtest'
    compileSdk 32
    buildToolsVersion '32.0.0'

    defaultConfig {
        applicationId 'com.orz.picootbackendtest'
        minSdk 29
        targetSdk 32
        versionCode 7
        versionName '0.1.0-dev.7'
        testInstrumentationRunner 'com.orz.picootbackendtest.BridgeSmokeInstrumentation'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // The PICO package installer rejected uncompressed/page-aligned native libraries
    // in the earlier probe. Keep the known-working legacy JNI packaging behavior.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
