plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orz.picootbackendtest'
    compileSdk 32
    buildToolsVersion '32.0.0'

    defaultConfig {
        applicationId 'com.orz.picootbackendtest'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1.0-dev'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DPICO_OT_BUILD_TESTS=OFF', '-DPICO_OT_BUILD_SHARED=ON'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    // The PICO package installer rejected uncompressed/page-aligned native libraries
    // in the earlier probe. Keep the known-working legacy JNI packaging behavior.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
