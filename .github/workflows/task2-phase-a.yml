name: Task 2 Phase A
on: [push, pull_request]
jobs:
  host:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/import_protocol_kit.py --verify
      - run: cmake -S . -B build -DPICO_OT_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --config Debug
      - run: ctest --test-dir build -C Debug --output-on-failure
      - run: cmake -S integrations/monaka -B build/capi -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/capi --config Debug
      - run: ctest --test-dir build/capi -C Debug --output-on-failure
      - run: python scripts/package_bridge_extraction.py
      - run: python scripts/verify_bridge_extraction.py --build
